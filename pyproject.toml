[project]
name = "toolpicker"
version = "0.0.1"
description = "ToolPicker - hybrid lexical + semantic tool selection for LLM agents with many tools."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ashwin Ugale", email = "ugaleashwin@gmail.com" }]
keywords = ["llm", "agents", "tool-calling", "tool-selection", "rag", "retrieval", "bm25", "rrf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core install is zero-dependency by design - every optional capability
# (embeddings, OpenAPI source, MCP source, docs) is an opt-in extra.
dependencies = []

[project.optional-dependencies]
# Embedding-provider extras. Currently OpenAI only; add others (Cohere,
# local sentence-transformers, etc.) as adapters land.
openai = ["openai>=1.40"]

# Tool-source extras. Function-call schemas are the universal format and
# need no extra deps; OpenAPI and MCP each ship behind a flag.
openapi = ["openapi-spec-validator>=0.7", "jsonref>=1.1"]
mcp = ["mcp>=0.1"]

# Token counting for budget packing. Same approach as Mneme.
tokens = ["tiktoken>=0.7"]

# Docs site (mkdocs-material + mkdocstrings autogen).
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "pymdown-extensions>=10.7",
]

[project.urls]
Homepage = "https://ashwinugale.github.io/toolpicker/"
Documentation = "https://ashwinugale.github.io/toolpicker/"
Repository = "https://github.com/ashwinugale/toolpicker"
Issues = "https://github.com/ashwinugale/toolpicker/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolpicker"]

# ---------------------------------------------------------------------------
# uv: dev dependencies live in a separate group so end-users never install them.
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    # OpenAI SDK so the embedding integration tests can run when a key is set.
    # Users opt in via the `openai` extra above.
    "openai>=1.40",
    # Loads .env in tests/conftest.py. Library itself never auto-loads dotenv.
    "python-dotenv>=1.0",
    # Tool-source extras (so the conformance tests for OpenAPI + MCP sources
    # run in dev without users opting in).
    "openapi-spec-validator>=0.7",
    "jsonref>=1.1",
    "mcp>=0.1",
    # Token counting for budget-packer tests.
    "tiktoken>=0.7",
    # Docs site. Users opt in via the `docs` extra above.
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "pymdown-extensions>=10.7",
]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------------------
# Ruff: lint + format in one tool. Same opinionated baseline as Mneme.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear (likely bugs)
    "UP",   # pyupgrade (modernize syntax)
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501", # line-too-long - formatter handles it
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Pytest: src layout means tests don't need sys.path tweaks once the package
# is installed via uv sync.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

# ---------------------------------------------------------------------------
# Mypy: strict for our own code, lenient at the edges.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# Third-party packages without type stubs.
[[tool.mypy.overrides]]
module = [
    "dotenv",
    "openapi_spec_validator",
    "jsonref",
    "mcp",
    "tiktoken",
    "yaml",
]
ignore_missing_imports = true
